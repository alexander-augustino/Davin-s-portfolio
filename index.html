<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | Alexander Augustino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --navy: #1e3c72; --accent-blue: #00d2ff; --dark: #0a0e14; }
        body { background-color: var(--dark); font-family: 'Segoe UI', sans-serif; color: white; overflow-x: hidden; }
        #intro-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease-out; }
        .circuit-svg { width: 280px; stroke: var(--accent-blue); stroke-width: 2; fill: none; stroke-dasharray: 500; stroke-dashoffset: 500; animation: flow 2.5s infinite alternate ease-in-out; }
        @keyframes flow { to { stroke-dashoffset: 0; filter: drop-shadow(0 0 15px var(--accent-blue)); } }
        .navbar { background: rgba(30, 60, 114, 0.9) !important; backdrop-filter: blur(10px); }
        .hero-section { background: linear-gradient(rgba(10, 14, 20, 0.7), rgba(10, 14, 20, 0.7)), url('https://images.unsplash.com/photo-1517077304055-6e89abbf09b0?auto=format&fit=crop&w=1350&q=80'); background-size: cover; background-position: center; height: 100vh; display: flex; align-items: center; }
        .btn-modern { padding: 12px 35px; border-radius: 50px; font-weight: 600; transition: 0.3s; border: 2px solid var(--accent-blue); color: white; text-decoration: none; }
        .btn-modern:hover { background: var(--accent-blue); color: var(--dark); transform: translateY(-3px); box-shadow: 0 0 20px var(--accent-blue); }
    </style>
</head>
<body>

<div id="intro-loader">
    <svg class="circuit-svg" viewBox="0 0 100 100"><path d="M0,50 L30,50 L40,20 L60,80 L70,50 L100,50" /></svg>
    <h2 style="margin-top: 20px; font-family: 'Courier New'; letter-spacing: 3px; font-size: 1rem;">INITIALIZING SYSTEM...</h2>
</div>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Alexander Augustino Project</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="index.html">Home</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="nav-link" href="achievement.html">Achievement</a>
            <a class="nav-link" href="pendidikan.html">Pendidikan</a>
            <a class="nav-link" href="contact.html" style="color: var(--accent-blue) !important; font-weight: bold;">Contact</a>
        </div>
    </div>
</nav>

<header class="hero-section">
    <div class="container text-center animate__animated animate__zoomIn">
        <h1 class="display-1 fw-bold mb-3" style="text-shadow: 0 0 20px var(--accent-blue);">Electrical Engineering</h1>
        <p class="lead fs-3 mb-5 text-uppercase" style="letter-spacing: 5px; opacity: 0.8;">Unpad • Angkatan 2025</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="about.html" class="btn-modern">Explore Profile</a>
            <a href="contact.html" class="btn-modern" style="border-color: white;">Contact Me</a>
        </div>
    </div>
</header>

<script>
    window.addEventListener('load', () => {
        const loader = document.getElementById('intro-loader');
        setTimeout(() => { if(loader) { loader.style.opacity = '0'; loader.style.pointerEvents = 'none'; setTimeout(() => { loader.style.display = 'none'; }, 800); } }, 1500);
    });

    document.addEventListener('click', function(e) {
        const target = e.target.closest('a');
        if (!target) return;
        const href = target.getAttribute('href');
        if (href && (href.startsWith('/') || href.endsWith('.html'))) {
            e.preventDefault();
            const loader = document.getElementById('intro-loader');
            if(loader) {
                loader.style.display = 'flex'; loader.style.pointerEvents = 'all';
                setTimeout(() => { loader.style.opacity = '1'; }, 10);
                setTimeout(() => { window.location.href = href; }, 700);
            }
        }
    });
</script>
</body>
</html>
