<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About | Alexander Augustino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --navy: #1e3c72; --navy-dark: #0a0e14; --accent-blue: #00d2ff; --white: #ffffff; --glass: rgba(255, 255, 255, 0.08); }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--navy-dark); color: var(--white); overflow-x: hidden; }
        #intro-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--navy-dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease; }
        .circuit-svg { width: 250px; stroke: var(--accent-blue); stroke-width: 2; fill: none; stroke-dasharray: 500; stroke-dashoffset: 500; animation: flow 3s infinite alternate; }
        @keyframes flow { to { stroke-dashoffset: 0; filter: drop-shadow(0 0 10px var(--accent-blue)); } }
        #spacetime-canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .navbar { background: rgba(30, 60, 114, 0.8) !important; backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .orbit-wrapper { position: relative; width: clamp(300px, 80vw, 450px); height: clamp(300px, 80vw, 450px); margin: 80px auto; }
        .center-core { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 130px; height: 130px; background: var(--navy); border: 3px solid var(--accent-blue); border-radius: 50%; z-index: 10; box-shadow: 0 0 30px var(--accent-blue); display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; }
        .node { position: absolute; width: 115px; height: 115px; background: rgba(245, 245, 245, 0.95); backdrop-filter: blur(5px); border: 2px solid var(--accent-blue); border-radius: 50%; color: var(--navy-dark); font-size: 0.85rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 5; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease; border: none; }
        .node:hover { background: var(--white) !important; color: var(--navy) !important; box-shadow: 0 0 35px var(--accent-blue); z-index: 100; }
        .n-top { top: 0; left: 50%; transform: translate(-50%, -50%) scale(1); }
        .n-bottom { top: 100%; left: 50%; transform: translate(-50%, -50%) scale(1); }
        .n-left { top: 50%; left: 0; transform: translate(-50%, -50%) scale(1); }
        .n-right { top: 50%; left: 100%; transform: translate(-50%, -50%) scale(1); }
        .n-top:hover, .n-bottom:hover, .n-left:hover, .n-right:hover { transform: translate(-50%, -50%) scale(1.2) !important; }
        #content-box { background: var(--glass); backdrop-filter: blur(15px); border-left: 5px solid var(--accent-blue); border-radius: 20px; max-width: 600px; margin: 40px auto; display: none; color: white; border-top: 1px solid rgba(255,255,255,0.1); }
        .hobi-link { color: var(--accent-blue); text-decoration: none; font-weight: bold; transition: 0.3s; }
        .hobi-link:hover { text-decoration: underline; color: #fff; }
    </style>
</head>
<body>

<div id="intro-loader">
    <svg class="circuit-svg" viewBox="0 0 100 100"><path d="M0,50 L30,50 L40,20 L60,80 L70,50 L100,50" /></svg>
    <div style="color: white; margin-top:20px; letter-spacing: 3px; font-family: monospace;">CALIBRATING SPACETIME...</div>
</div>

<canvas id="spacetime-canvas"></canvas>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Alexander Augustino Project</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="about.html">About</a>
            <a class="nav-link" href="achievement.html">Achievement</a>
            <a class="nav-link" href="pendidikan.html">Pendidikan</a>
            <a class="nav-link" href="contact.html" style="color: var(--accent-blue) !important; font-weight: bold;">Contact</a>
        </div>
    </div>
</nav>

<div class="container text-center py-5">
    <div class="orbit-wrapper">
        <div class="center-core">ABOUT<br>DAVIN</div>
        <button class="node n-top" onclick="showContent('Latar Belakang', 'Perkenalkan saya Davin Trianto, Mahasiswa Teknik Elektro Unpad 2025. Lahir 28 Feb 2007 di Kuningan. Suka warna Biru, Ayam Tumis Cabai Hijau, dan aktif dalam filosofi Eksistensialis Kierkegaard. Motto: Aut Viam Inveniam, Aut Faciam.')">Background</button>
        
        <button class="node n-bottom" onclick="showHobi()">Hobi</button>
        
        <button class="node n-left" onclick="window.location.href='pendidikan.html'">Pendidikan</button>
        <button class="node n-right" onclick="window.location.href='achievement.html'">Achievement</button>
    </div>
    <div id="content-box" class="p-5 animate__animated">
        <h4 id="content-title" class="fw-bold" style="color: var(--accent-blue);"></h4>
        <div id="content-body" class="lead fs-6 mt-3"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('spacetime-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, spacing = 45;
    const mouse = { x: -1000, y: -1000 };
    function init() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('resize', init);
    function draw() {
        ctx.clearRect(0, 0, width, height); ctx.strokeStyle = "rgba(0, 210, 255, 0.12)";
        for (let i = 0; i < height/spacing; i++) {
            ctx.beginPath();
            for (let j = 0; j < width/spacing; j++) {
                let x = j*spacing, y = i*spacing, dx = mouse.x-x, dy = mouse.y-y, dist = Math.sqrt(dx*dx + dy*dy), force = Math.max(0, (200-dist)/200), tx = x + dx*force*0.4, ty = y + dy*force*0.4;
                if (j===0) ctx.moveTo(tx, ty); else ctx.lineTo(tx, ty);
            }
            ctx.stroke();
        }
        for (let j = 0; j < width/spacing; j++) {
            ctx.beginPath();
            for (let i = 0; i < height/spacing; i++) {
                let x = j*spacing, y = i*spacing, dx = mouse.x-x, dy = mouse.y-y, dist = Math.sqrt(dx*dx + dy*dy), force = Math.max(0, (200-dist)/200), tx = x + dx*force*0.4, ty = y + dy*force*0.4;
                if (i===0) ctx.moveTo(tx, ty); else ctx.lineTo(tx, ty);
            }
            ctx.stroke();
        }
        requestAnimationFrame(draw);
    }
    init(); draw();

    // Fungsi Umum
    function showContent(title, body) {
        const box = document.getElementById('content-box');
        document.getElementById('content-title').innerText = title;
        document.getElementById('content-body').innerHTML = body; // Pakai innerHTML biar link aktif
        box.style.display = 'block'; box.classList.remove('animate__fadeInUp'); void box.offsetWidth; box.classList.add('animate__fadeInUp');
        box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Fungsi khusus Hobi buat nampilin link
    function showHobi() {
        const hobiContent = `
            Hobi saya meliputi: <br><br>
            • <b>Problem Solving Kalkulus</b> & Merenung <br>
            • <a href="hobi-berenang.html" class="hobi-link">Berenang & Main ke Pantai 🌊</a> <br>
            • <a href="https://act.hoyolab.com/app/community-game-records-sea/rpg/index.html?user_id=181362088#/hsr" target="_blank" class="hobi-link">Main Game RPG (Honkai: Star Rail) 🎮</a>
        `;
        showContent('Hobi', hobiContent);
    }

    window.addEventListener('load', () => {
        const loader = document.getElementById('intro-loader');
        setTimeout(() => { if(loader) { loader.style.opacity = '0'; loader.style.pointerEvents = 'none'; setTimeout(() => { loader.style.display = 'none'; }, 800); } }, 1000);
    });
</script>
</body>
</html>
