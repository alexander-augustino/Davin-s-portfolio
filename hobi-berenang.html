<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hobi: Pantai & Berenang | Davin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --navy: #1e3c72; --navy-dark: #0a0e14; --accent-blue: #00d2ff; --white: #ffffff; }

        body { 
            background-color: var(--navy-dark); 
            color: var(--white); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
            margin: 0;
        }

        /* Canvas Background */
        #spacetime-canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        .glass-card {
            background: rgba(30, 60, 114, 0.2);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-top: 50px;
        }

        .gallery-img { 
            border-radius: 15px; 
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer; 
            height: 250px; 
            object-fit: cover; 
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .gallery-img:hover { 
            transform: translateY(-10px) scale(1.03); 
            border: 2px solid var(--accent-blue);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
        }

        .btn-custom {
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 10px 25px;
            border-radius: 30px;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-custom:hover {
            background: var(--accent-blue);
            color: var(--navy-dark);
            box-shadow: 0 0 15px var(--accent-blue);
        }
    </style>
</head>
<body>

<canvas id="spacetime-canvas"></canvas>

<div class="container py-5">
    <div class="glass-card animate__animated animate__fadeIn">
        <h1 class="fw-bold mb-2 text-center">Pantai & Berenang 🌊</h1>
        <p class="text-center text-info mb-5">Menikmati deburan ombak dan kesegaran air</p>
        
        <div class="row g-4">
            <div class="col-md-4 col-sm-6 animate__animated animate__zoomIn" style="animation-delay: 0.1s;">
                <img src="Hobi-Pantai/1.jpeg" class="gallery-img" alt="Pantai 1">
            </div>
            <div class="col-md-4 col-sm-6 animate__animated animate__zoomIn" style="animation-delay: 0.2s;">
                <img src="Hobi-Pantai/2.jpeg" class="gallery-img" alt="Pantai 2">
            </div>
            <div class="col-md-4 col-sm-6 animate__animated animate__zoomIn" style="animation-delay: 0.3s;">
                <img src="Hobi-Pantai/3.jpeg" class="gallery-img" alt="Pantai 3">
            </div>
            <div class="col-md-4 col-sm-6 animate__animated animate__zoomIn" style="animation-delay: 0.4s;">
                <img src="Hobi-Pantai/4.jpeg" class="gallery-img" alt="Pantai 4">
            </div>
            <div class="col-md-4 col-sm-6 animate__animated animate__zoomIn" style="animation-delay: 0.5s;">
                <img src="Hobi-Pantai/5.jpeg" class="gallery-img" alt="Pantai 5">
            </div>
            <div class="col-md-4 col-sm-6 animate__animated animate__zoomIn" style="animation-delay: 0.6s;">
                <img src="Hobi-Pantai/6.jpeg" class="gallery-img" alt="Pantai 6">
            </div>
        </div>

        <div class="mt-5 text-center">
            <a href="about.html" class="btn-custom"> Kembali ke About</a>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('spacetime-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0;
            if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            if (this.y < 0) this.y = canvas.height;
        }
        draw() {
            ctx.fillStyle = 'rgba(0, 210, 255, 0.5)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function createParticles() {
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    createParticles();
    animate();
</script>

</body>
</html>
