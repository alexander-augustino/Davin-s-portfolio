<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pendidikan | Alexander Augustino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --navy: #1e3c72; --accent-blue: #00d2ff; --navy-dark: #0a0e14; }
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        #intro-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--navy-dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s ease-out; }
        .circuit-svg { width: 250px; stroke: var(--accent-blue); stroke-width: 2; fill: none; stroke-dasharray: 500; stroke-dashoffset: 500; animation: flow 3s infinite alternate ease-in-out; }
        @keyframes flow { to { stroke-dashoffset: 0; filter: drop-shadow(0 0 15px var(--accent-blue)); } }
        .navbar { background: var(--navy) !important; padding: 15px 0; }
        .header-section { background: linear-gradient(135deg, var(--navy), #2a5298); color: white; padding: 100px 0; clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%); }
        .text-fade-up { opacity: 0; transform: translateY(40px); transition: all 0.9s cubic-bezier(0.23, 1, 0.32, 1); }
        .text-fade-up.active { opacity: 1; transform: translateY(0); }
        .edu-card { background: white; border-radius: 25px; border-left: 8px solid var(--accent-blue); box-shadow: 0 15px 40px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="intro-loader">
    <svg class="circuit-svg" viewBox="0 0 100 100"><path d="M0,50 L30,50 L40,20 L60,80 L70,50 L100,50" /></svg>
    <div style="color: white; margin-top: 20px; font-family: 'Courier New'; letter-spacing: 3px;">MAPPING KNOWLEDGE...</div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Alexander Augustino Project</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="nav-link" href="achievement.html">Achievement</a>
            <a class="nav-link active" href="pendidikan.html">Pendidikan</a>
            <a class="nav-link" href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<div class="header-section text-center">
    <div class="container">
        <h1 class="display-4 fw-bold text-fade-up">Riwayat Pendidikan</h1>
        <p class="lead text-fade-up">"Setelah Gelap, Terbitlah Terang"</p>
    </div>
</div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card edu-card p-5 text-fade-up">
                <div class="fs-5 text-secondary" style="white-space: pre-line; line-height: 1.8;">
                    Riwayat pendidikan saya selama ini:
                    1. SMP Yos Sudarso Cigugur
                    2. SMA Negeri 2 Kuningan
                    3. Universitas Padjadjaran (Undergraduate - Teknik Elektro)
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.addEventListener('load', () => {
        const loader = document.getElementById('intro-loader');
        setTimeout(() => {
            if (loader) {
                loader.style.opacity = '0'; loader.style.pointerEvents = 'none';
                document.querySelectorAll('.text-fade-up').forEach((el, index) => {
                    setTimeout(() => el.classList.add('active'), 400 + (index * 250));
                });
                setTimeout(() => loader.style.display = 'none', 800);
            }
        }, 1200);
    });
</script>
</body>
</html>
