<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Alexander Augustino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --navy: #0a192f; 
            --navy-dark: #020406; 
            --accent-blue: #00d2ff; 
            --glow-blue: rgba(0, 210, 255, 0.6);
            --deep-blue: #0072ff;
            --white: #ffffff; 
        }

        body { 
            background-color: var(--navy-dark); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            color: white;
            perspective: 1200px;
        }
        
        /* Intro Loader */
        #intro-loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--navy-dark); z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 1s ease-out; 
        }
        .circuit-svg { 
            width: 280px; stroke: var(--accent-blue); stroke-width: 2; fill: none; 
            stroke-dasharray: 500; stroke-dashoffset: 500; 
            animation: flow 3s infinite alternate ease-in-out; 
        }
        @keyframes flow { to { stroke-dashoffset: 0; filter: drop-shadow(0 0 15px var(--accent-blue)); } }
        
        /* Background Canvas */
        #blackhole-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* Nav */
        .navbar { 
            background: rgba(2, 4, 6, 0.7) !important; 
            backdrop-filter: blur(15px);
            padding: 15px 0; 
            border-bottom: 1px solid rgba(0, 210, 255, 0.1);
        }
        
        .header-section { 
            position: relative;
            padding: 160px 0 60px 0; 
            overflow: visible;
        }

        /* Blackhole Visual - VERTICAL ORIENTATION */
        .singularity-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .bh-disk {
            position: absolute;
            width: 110px;
            height: 110px;
            background: #000;
            border-radius: 50%;
            box-shadow: 
                0 0 30px 5px #000,
                0 0 60px 10px var(--deep-blue),
                0 0 100px 20px var(--glow-blue);
            z-index: 10;
        }

        /* Cakram Akresi Vertikal & Berputar Searah Jarum Jam */
        .accretion-trail {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 40%, var(--accent-blue) 48%, transparent 52%);
            filter: blur(15px);
            opacity: 0.4;
            /* Diubah ke rotateY untuk efek vertikal */
            animation: rotate-vertical 6s linear infinite;
        }

        .accretion-trail-inner {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 38%, var(--deep-blue) 50%, transparent 55%);
            filter: blur(10px);
            opacity: 0.5;
            /* Reverse untuk efek kedalaman dinamis */
            animation: rotate-vertical 4s linear infinite reverse;
        }

        /* Keyframe Rotasi Vertikal (Sumbu Y) */
        @keyframes rotate-vertical {
            from { transform: rotateY(75deg) rotateZ(0deg); }
            to { transform: rotateY(75deg) rotateZ(360deg); }
        }

        .attraction-zone { transform-style: preserve-3d; }
        
        .text-reveal { 
            opacity: 0; 
            transform: translateY(40px) translateZ(0); 
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        .text-reveal.active { 
            opacity: 1; 
            transform: translateY(0) translateZ(80px); 
        }
        
        .contact-link { 
            text-decoration: none; color: #fff; display: flex; align-items: center; 
            padding: 22px; border-radius: 24px; 
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background: rgba(255, 255, 255, 0.03); 
            margin-bottom: 20px; 
            border: 1px solid rgba(0, 210, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .contact-link:hover { 
            transform: scale(1.05) translateZ(50px); 
            background: rgba(0, 210, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.2); 
            border-color: var(--accent-blue);
        }

        .icon-wa { color: #25D366; font-size: 2.2rem; margin-right: 20px; }
        .icon-ig { color: #E4405F; font-size: 2.2rem; margin-right: 20px; }

        .vignette-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 10%, rgba(0,0,0,0.9) 100%);
            pointer-events: none; z-index: 1;
        }
    </style>
</head>
<body>

<div class="vignette-overlay"></div>

<div id="intro-loader">
    <svg class="circuit-svg" viewBox="0 0 100 100"><path d="M0,50 L30,50 L40,20 L60,80 L70,50 L100,50" /></svg>
    <div style="color: var(--accent-blue); margin-top: 20px; font-family: 'Courier New'; letter-spacing: 3px;">ESTABLISHING CONNECTION...</div>
</div>

<canvas id="blackhole-canvas"></canvas>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Alexander Augustino Project</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="nav-link" href="achievement.html">Achievement</a>
            <a class="nav-link" href="pendidikan.html">Pendidikan</a>
            <a class="nav-link active" href="contact.html" style="color: var(--accent-blue) !important; font-weight: bold; text-shadow: 0 0 10px var(--glow-blue);">Contact</a>
        </div>
    </div>
</nav>

<div class="header-section text-center attraction-zone">
    <div class="singularity-container">
        <div class="accretion-trail"></div>
        <div class="accretion-trail-inner"></div>
        <div class="bh-disk" id="bh-core"></div>
    </div>
    
    <div class="container">
        <h1 class="display-3 fw-bold text-reveal" style="text-shadow: 0 0 25px var(--glow-blue); color: #fff;">Contact Me</h1>
        <p class="lead text-reveal" style="letter-spacing: 3px; color: var(--accent-blue); text-shadow: 0 0 10px var(--glow-blue);">"Be Prepared for our EXCITEMENT!!!"</p>
    </div>
</div>

<div class="container py-4 attraction-zone" style="position: relative; z-index: 2;">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <a href="https://wa.me/6281320711880" target="_blank" class="contact-link text-reveal">
                <i class="fa-brands fa-whatsapp icon-wa"></i>
                <div class="text-start">
                    <h5 class="mb-0 fw-bold">WhatsApp</h5>
                    <span style="color: #ccc; font-size: 0.9rem;">081320711880</span>
                </div>
            </a>

            <a href="https://instagram.com/alexander_augustino" target="_blank" class="contact-link text-reveal">
                <i class="fa-brands fa-instagram icon-ig"></i>
                <div class="text-start">
                    <h5 class="mb-0 fw-bold">Instagram</h5>
                    <span style="color: #ccc; font-size: 0.9rem;">@alexander_augustino</span>
                </div>
            </a>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('blackhole-canvas');
    const ctx = canvas.getContext('2d');
    const bhCore = document.getElementById('bh-core');
    let width, height;
    let particles = [];

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        // Meningkatkan jumlah partikel untuk efek chaos yang lebih padat
        for (let i = 0; i < 200; i++) {
            particles.push(new Particle());
        }
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            // Posisi awal jauh dari pusat
            this.angle = Math.random() * Math.PI * 2;
            this.radius = Math.max(width, height) * (Math.random() * 0.6 + 0.2);
            
            this.x = width / 2 + Math.cos(this.angle) * this.radius;
            this.y = height / 2 + Math.sin(this.angle) * this.radius;
            
            this.size = Math.random() * 1.8 + 0.2;
            // Kecepatan putaran (searah jarum jam)
            this.velocity = Math.random() * 0.02 + 0.01;
            // Kecepatan tertarik ke dalam (sentripetal)
            this.accel = Math.random() * 2 + 1;
            this.color = Math.random() > 0.3 ? '#00d2ff' : '#ffffff';
            
            // Simpan posisi sebelumnya untuk trail effect
            this.history = [{x: this.x, y: this.y}];
        }

        update() {
            const rect = bhCore.getBoundingClientRect();
            const targetX = rect.left + rect.width / 2;
            const targetY = rect.top + rect.height / 2;

            // Logika Spiral/Chaos: Mengurangi radius sambil menambah sudut
            this.radius -= this.accel;
            this.angle += this.velocity;

            this.x = targetX + Math.cos(this.angle) * this.radius;
            this.y = targetY + Math.sin(this.angle) * this.radius;

            // Jika terlalu dekat dengan event horizon, reset
            if (this.radius < 20) {
                this.reset();
            }

            // Menyimpan trail pendek
            this.history.push({x: this.x, y: this.y});
            if (this.history.length > 5) this.history.shift();
        }

        draw() {
            // Menggambar garis trail (Chaos Lines)
            ctx.beginPath();
            ctx.strokeStyle = this.color;
            ctx.lineWidth = this.size;
            ctx.lineCap = 'round';
            for (let i = 0; i < this.history.length - 1; i++) {
                ctx.moveTo(this.history[i].x, this.history[i].y);
                ctx.lineTo(this.history[i+1].x, this.history[i+1].y);
            }
            ctx.stroke();

            // Efek kilau partikel
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function animate() {
        // Overlay hitam transparan menciptakan motion blur/trail
        ctx.fillStyle = 'rgba(2, 4, 6, 0.15)';
        ctx.fillRect(0, 0, width, height);
        
        // Gunakan lighter composite untuk efek glow tabrakan debu
        ctx.globalCompositeOperation = 'lighter';
        particles.forEach(p => { 
            p.update(); 
            p.draw(); 
        });
        ctx.globalCompositeOperation = 'source-over';
        
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    animate();

    window.addEventListener('load', () => {
        const loader = document.getElementById('intro-loader');
        setTimeout(() => {
            if (loader) {
                loader.style.opacity = '0'; 
                loader.style.pointerEvents = 'none';
                document.querySelectorAll('.text-reveal').forEach((el, index) => {
                    setTimeout(() => el.classList.add('active'), 300 + (index * 150));
                });
                setTimeout(() => loader.style.display = 'none', 1000);
            }
        }, 1000);
    });
</script>
</body>
</html>
