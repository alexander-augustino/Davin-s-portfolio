<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --navy: #0a192f; 
            --navy-dark: #020406; 
            --accent-blue: #00d2ff; 
            --glow-blue: rgba(0, 210, 255, 0.6);
            --deep-blue: #0072ff;
            --white: #ffffff; 
        }

        body { 
            background-color: var(--navy-dark); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            color: white;
            perspective: 1200px;
        }
        
        /* FIX REVISI: Full Page Loader Tanpa Leak */
        #intro-loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #020406; /* Solid black */
            z-index: 10000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            transition: opacity 0.8s ease-in-out; 
        }

        .circuit-svg { 
            width: 280px; stroke: var(--accent-blue); stroke-width: 2; fill: none; 
            stroke-dasharray: 500; stroke-dashoffset: 500; 
            animation: flow 3s infinite alternate ease-in-out; 
        }
        @keyframes flow { to { stroke-dashoffset: 0; filter: drop-shadow(0 0 15px var(--accent-blue)); } }
        
        #blackhole-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            background: #000;
        }

        .navbar { 
            background: rgba(2, 4, 6, 0.8) !important; 
            backdrop-filter: blur(15px);
            padding: 15px 0; 
            border-bottom: 1px solid rgba(0, 210, 255, 0.1);
            z-index: 1000;
        }
        
        .header-section { 
            position: relative;
            padding: 180px 0 60px 0; 
            overflow: visible;
        }

        /* Singularity Core Only */
        .singularity-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bh-disk {
            width: 120px;
            height: 120px;
            background: #000;
            border-radius: 50%;
            box-shadow: 
                0 0 40px 10px #000,
                0 0 70px 20px var(--deep-blue),
                0 0 120px 30px var(--glow-blue);
            z-index: 10;
        }

        .text-reveal { 
            opacity: 0; 
            transform: translateY(30px); 
            transition: all 1s ease-out; 
        }
        .text-reveal.active { 
            opacity: 1; 
            transform: translateY(0); 
        }
        
        .contact-link { 
            text-decoration: none; color: #fff; display: flex; align-items: center; 
            padding: 22px; border-radius: 24px; 
            transition: 0.4s ease; 
            background: rgba(255, 255, 255, 0.03); 
            margin-bottom: 20px; 
            border: 1px solid rgba(0, 210, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .contact-link:hover { 
            transform: translateY(-5px); 
            background: rgba(0, 210, 255, 0.08);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .icon-wa { color: #25D366; font-size: 2rem; margin-right: 20px; }
        .icon-ig { color: #E4405F; font-size: 2rem; margin-right: 20px; }

        .vignette-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.8) 100%);
            pointer-events: none; z-index: 1;
        }
    </style>
</head>
<body>

<div id="intro-loader">
    <svg class="circuit-svg" viewBox="0 0 100 100"><path d="M0,50 L30,50 L40,20 L60,80 L70,50 L100,50" /></svg>
    <div style="color: var(--accent-blue); margin-top: 20px; font-family: 'Courier New'; letter-spacing: 3px; font-weight: bold;">ESTABLISHING CONNECTION...</div>
</div>

<div class="vignette-overlay"></div>
<canvas id="blackhole-canvas"></canvas>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Alexander Augustino Project</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="#">Home</a>
            <a class="nav-link" href="#">About</a>
            <a class="nav-link active" href="#" style="color: var(--accent-blue) !important; text-shadow: 0 0 10px var(--glow-blue);">Contact</a>
        </div>
    </div>
</nav>

<div class="header-section text-center">
    <div class="singularity-container">
        <div class="bh-disk" id="bh-core"></div>
    </div>
    
    <div class="container">
        <h1 class="display-3 fw-bold text-reveal">Contact Me</h1>
        <p class="lead text-reveal" style="letter-spacing: 3px; color: var(--accent-blue);">"Be Prepared for our EXCITEMENT!!!"</p>
    </div>
</div>

<div class="container py-4" style="position: relative; z-index: 2;">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <a href="https://wa.me/6281320711880" target="_blank" class="contact-link text-reveal">
                <i class="fa-brands fa-whatsapp icon-wa"></i>
                <div class="text-start">
                    <h5 class="mb-0 fw-bold">WhatsApp</h5>
                    <span style="color: #ccc; font-size: 0.9rem;">081320711880</span>
                </div>
            </a>

            <a href="https://instagram.com/alexander_augustino" target="_blank" class="contact-link text-reveal">
                <i class="fa-brands fa-instagram icon-ig"></i>
                <div class="text-start">
                    <h5 class="mb-0 fw-bold">Instagram</h5>
                    <span style="color: #ccc; font-size: 0.9rem;">@alexander_augustino</span>
                </div>
            </a>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('blackhole-canvas');
    const ctx = canvas.getContext('2d');
    const bhCore = document.getElementById('bh-core');
    let width, height, centerX, centerY;
    
    let backgroundParticles = [];
    let diskParticles = [];

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        centerX = width / 2;
        centerY = height / 2;
        
        backgroundParticles = [];
        diskParticles = [];

        // 1. Partikel Background (Linear)
        for (let i = 0; i < 150; i++) {
            backgroundParticles.push(new LinearParticle());
        }

        // 2. Partikel Cakram Akresi (Chaos Orbit)
        for (let i = 0; i < 300; i++) {
            diskParticles.push(new AccretionParticle());
        }
    }

    // --- REVISI 1: Gerakan Linear Ke Arah Blackhole ---
    class LinearParticle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 1.5;
            this.speed = Math.random() * 2 + 0.5;
            this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
            let dx = centerX - this.x;
            let dy = centerY - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            // Gerak lurus ke pusat
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;

            if (dist < 30) this.reset();
        }
        draw() {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // --- REVISI 2 & 3: Cakram Akresi Dinamis & Chaos (Benang Kosmis) ---
    class AccretionParticle {
        constructor() { this.reset(); }
        reset() {
            this.angle = Math.random() * Math.PI * 2;
            this.radius = 80 + Math.random() * 120; // Membentuk lingkaran di sekitar core
            this.targetRadius = this.radius;
            
            // Simulasi air/sentripetal: makin dekat makin cepat
            this.angularSpeed = (Math.random() * 0.04 + 0.02) * (150 / this.radius);
            this.radialSpeed = Math.random() * 0.5;
            
            this.history = [];
            this.historyLimit = 15 + Math.random() * 20; // Membuat efek "benang" panjang
            this.color = Math.random() > 0.5 ? '#00d2ff' : '#0072ff';
            this.chaosOffset = Math.random() * 100;
        }

        update() {
            // Chaos system menggunakan sine wave untuk fluktuasi orbit
            let chaos = Math.sin(Date.now() * 0.002 + this.chaosOffset) * 2;
            
            this.angle += this.angularSpeed;
            this.radius -= 0.2; // Perlahan tersedot ke dalam (spiral)
            
            let x = centerX + Math.cos(this.angle) * (this.radius + chaos);
            let y = centerY + Math.sin(this.angle) * (this.radius + chaos);

            this.history.push({x, y});
            if (this.history.length > this.historyLimit) this.history.shift();

            if (this.radius < 40) this.reset();
        }

        draw() {
            if (this.history.length < 2) return;
            
            ctx.beginPath();
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 0.8;
            ctx.lineCap = 'round';
            ctx.globalAlpha = 0.6;
            
            ctx.moveTo(this.history[0].x, this.history[0].y);
            for (let i = 1; i < this.history.length; i++) {
                ctx.lineTo(this.history[i].x, this.history[i].y);
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }
    }

    function animate() {
        // Trail effect untuk kehalusan pergerakan
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, width, height);

        ctx.globalCompositeOperation = 'lighter';
        backgroundParticles.forEach(p => { p.update(); p.draw(); });
        diskParticles.forEach(p => { p.update(); p.draw(); });
        ctx.globalCompositeOperation = 'source-over';

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    animate();

    // Loader logic
    window.addEventListener('load', () => {
        const loader = document.getElementById('intro-loader');
        setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
                document.querySelectorAll('.text-reveal').forEach((el, i) => {
                    setTimeout(() => el.classList.add('active'), i * 200);
                });
            }, 800);
        }, 1500);
    });
</script>
</body>
</html>
