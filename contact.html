<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Alexander Augustino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --navy: #1e3c72; 
            --navy-dark: #020406; 
            --accent-blue: #00d2ff; 
            --bh-orange: #ff8c00;
            --bh-red: #ff4500;
            --white: #ffffff; 
        }

        body { 
            background-color: var(--navy-dark); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            color: white;
            perspective: 1200px;
        }
        
        /* Intro Loader - Sesuai Request */
        #intro-loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--navy-dark); z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 1s ease-out; 
        }
        .circuit-svg { 
            width: 280px; stroke: var(--accent-blue); stroke-width: 2; fill: none; 
            stroke-dasharray: 500; stroke-dashoffset: 500; 
            animation: flow 3s infinite alternate ease-in-out; 
        }
        @keyframes flow { to { stroke-dashoffset: 0; filter: drop-shadow(0 0 15px var(--accent-blue)); } }
        
        /* Background Canvas */
        #blackhole-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* Nav */
        .navbar { 
            background: rgba(2, 4, 6, 0.7) !important; 
            backdrop-filter: blur(15px);
            padding: 15px 0; 
            border-bottom: 1px solid rgba(255, 140, 0, 0.1);
        }
        
        /* Header & Blackhole Core */
        .header-section { 
            position: relative;
            padding: 180px 0 120px 0; 
            overflow: visible;
        }

        /* Blackhole Visual Manipulation */
        .singularity-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bh-disk {
            position: absolute;
            width: 450px; /* Ukuran diperbesar sesuai teks */
            height: 450px;
            background: radial-gradient(circle, #000 30%, transparent 70%);
            border-radius: 50%;
            box-shadow: 
                0 0 40px 10px #000,
                0 0 100px 20px var(--bh-red),
                0 0 150px 40px rgba(255, 140, 0, 0.4);
            animation: rotate-disk 10s linear infinite;
        }

        /* Efek Cakram Spiral (Bolder & Real) */
        .bh-disk::after {
            content: '';
            position: absolute;
            top: -10%; left: -10%; right: -10%; bottom: -10%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, transparent 40%, var(--bh-orange) 50%, transparent 65%);
            filter: blur(15px);
            opacity: 0.7;
            transform: rotateX(60deg); /* Membuat cakram terlihat pipih/realistik */
        }

        @keyframes rotate-disk {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* GFX Manipulation: Elemen tertarik */
        .attraction-zone { transform-style: preserve-3d; }
        
        .text-reveal { 
            opacity: 0; 
            transform: translateY(40px) translateZ(0); 
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        .text-reveal.active { 
            opacity: 1; 
            transform: translateY(0) translateZ(80px); /* Terasa lebih keluar */
        }
        
        /* Kartu Kontak */
        .contact-link { 
            text-decoration: none; color: #fff; display: flex; align-items: center; 
            padding: 25px; border-radius: 24px; 
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background: rgba(255, 255, 255, 0.03); 
            margin-bottom: 25px; 
            border: 1px solid rgba(255, 140, 0, 0.1);
            backdrop-filter: blur(8px);
        }

        .contact-link:hover { 
            transform: scale(1.05) translateZ(50px); 
            background: rgba(255, 140, 0, 0.1);
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.2); 
            border-color: var(--bh-orange);
        }

        .icon-wa { color: #25D366; font-size: 2.5rem; margin-right: 25px; }
        .icon-ig { color: #E4405F; font-size: 2.5rem; margin-right: 25px; }

        .vignette-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 10%, rgba(0,0,0,0.9) 100%);
            pointer-events: none; z-index: 1;
        }
    </style>
</head>
<body>

<div class="vignette-overlay"></div>

<div id="intro-loader">
    <svg class="circuit-svg" viewBox="0 0 100 100"><path d="M0,50 L30,50 L40,20 L60,80 L70,50 L100,50" /></svg>
    <div style="color: white; margin-top: 20px; font-family: 'Courier New'; letter-spacing: 3px;">ESTABLISHING CONNECTION...</div>
</div>

<canvas id="blackhole-canvas"></canvas>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Alexander Augustino Project</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="nav-link" href="achievement.html">Achievement</a>
            <a class="nav-link" href="pendidikan.html">Pendidikan</a>
            <a class="nav-link active" href="contact.html" style="color: var(--bh-orange) !important; font-weight: bold;">Contact</a>
        </div>
    </div>
</nav>

<div class="header-section text-center attraction-zone">
    <div class="singularity-container">
        <div class="bh-disk" id="bh-core"></div>
    </div>
    
    <div class="container">
        <h1 class="display-3 fw-bold text-reveal" style="text-shadow: 0 0 30px rgba(255,140,0,0.6); color: #fff;">Contact Me</h1>
        <p class="lead text-reveal" style="letter-spacing: 3px; color: #ffa500;">"Be Prepared for our EXCITEMENT!!!"</p>
    </div>
</div>

<div class="container py-5 attraction-zone" style="position: relative; z-index: 2;">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <a href="https://wa.me/6281320711880" target="_blank" class="contact-link text-reveal">
                <i class="fa-brands fa-whatsapp icon-wa"></i>
                <div class="text-start">
                    <h5 class="mb-0 fw-bold">WhatsApp</h5>
                    <span style="color: #aaa;">081320711880</span>
                </div>
            </a>

            <a href="https://instagram.com/alexander_augustino" target="_blank" class="contact-link text-reveal">
                <i class="fa-brands fa-instagram icon-ig"></i>
                <div class="text-start">
                    <h5 class="mb-0 fw-bold">Instagram</h5>
                    <span style="color: #aaa;">@alexander_augustino</span>
                </div>
            </a>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('blackhole-canvas');
    const ctx = canvas.getContext('2d');
    const bhCore = document.getElementById('bh-core');
    let width, height;
    let particles = [];

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 200; i++) {
            particles.push(new Particle());
        }
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.max(width, height) * (Math.random() * 0.8 + 0.2);
            this.x = width / 2 + Math.cos(angle) * dist;
            this.y = height / 2 + Math.sin(angle) * dist;
            this.size = Math.random() * 2 + 0.5;
            this.speed = Math.random() * 3 + 1;
            this.color = Math.random() > 0.5 ? '#ff8c00' : '#ffffff';
        }

        update() {
            // REVISI 3: Target fokus ke koordinat Blackhole (Header)
            const rect = bhCore.getBoundingClientRect();
            const targetX = rect.left + rect.width / 2;
            const targetY = rect.top + rect.height / 2;

            const dx = targetX - this.x;
            const dy = targetY - this.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 30) {
                this.reset();
            } else {
                const force = Math.min(12, 800 / distance);
                this.x += (dx / distance) * force * this.speed;
                this.y += (dy / distance) * force * this.speed;
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(2, 4, 6, 0.15)';
        ctx.fillRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    animate();

    window.addEventListener('load', () => {
        const loader = document.getElementById('intro-loader');
        setTimeout(() => {
            if (loader) {
                loader.style.opacity = '0'; 
                loader.style.pointerEvents = 'none';
                document.querySelectorAll('.text-reveal').forEach((el, index) => {
                    setTimeout(() => el.classList.add('active'), 400 + (index * 200));
                });
                setTimeout(() => loader.style.display = 'none', 1000);
            }
        }, 1200);
    });
</script>
</body>
</html>
