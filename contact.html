<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Alexander Augustino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --navy: #0a192f; 
            --navy-dark: #020406; 
            --accent-blue: #00d2ff; 
            --glow-blue: rgba(0, 210, 255, 0.6);
            --deep-blue: #0072ff;
            --white: #ffffff; 
        }

        body { 
            background-color: var(--navy-dark); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            color: white;
            perspective: 1200px;
        }
        
        #intro-loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #020406; 
            z-index: 10000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            transition: opacity 0.8s ease-in-out; 
        }

        .loader-text {
            color: white; 
            margin-top: 25px; 
            font-family: 'Courier New', Courier, monospace; 
            letter-spacing: 4px; 
            font-weight: normal; 
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .circuit-svg { 
            width: 250px; stroke: var(--accent-blue); stroke-width: 1.5; fill: none; 
            stroke-dasharray: 500; stroke-dashoffset: 500; 
            animation: flow 3s infinite alternate ease-in-out; 
        }
        @keyframes flow { to { stroke-dashoffset: 0; filter: drop-shadow(0 0 10px var(--accent-blue)); } }
        
        #blackhole-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            background: #000;
        }

        .navbar { 
            background: rgba(2, 4, 6, 0.8) !important; 
            backdrop-filter: blur(15px);
            padding: 15px 0; 
            border-bottom: 1px solid rgba(0, 210, 255, 0.1);
            z-index: 1000;
        }
        
        .header-section { 
            position: relative;
            padding: 220px 0 100px 0; 
            overflow: visible;
        }

        .text-reveal { 
            opacity: 0; 
            transform: translateY(30px); 
            transition: all 1s ease-out; 
            position: relative;
            z-index: 5;
        }
        .text-reveal.active { 
            opacity: 1; 
            transform: translateY(0); 
        }
        
        .contact-link { 
            text-decoration: none; color: #fff; display: flex; align-items: center; 
            padding: 22px; border-radius: 24px; 
            transition: 0.4s ease; 
            background: rgba(255, 255, 255, 0.03); 
            margin-bottom: 20px; 
            border: 1px solid rgba(0, 210, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .contact-link:hover { 
            transform: translateY(-5px); 
            background: rgba(0, 210, 255, 0.08);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .icon-wa { color: #25D366; font-size: 2rem; margin-right: 20px; }
        .icon-ig { color: #E4405F; font-size: 2rem; margin-right: 20px; }

        .vignette-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 10%, rgba(0,0,0,0.8) 100%);
            pointer-events: none; z-index: 1;
        }
    </style>
</head>
<body>

<div id="intro-loader">
    <svg class="circuit-svg" viewBox="0 0 100 100"><path d="M0,50 L30,50 L40,20 L60,80 L70,50 L100,50" /></svg>

</div>

<div class="vignette-overlay"></div>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">

        <a class="navbar-brand fw-bold" href="index.html">Alexander Augustino Project</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>

            <a class="nav-link" href="achievement.html">Achievement</a>
            <a class="nav-link" href="pendidikan.html">Pendidikan</a>
            <a class="nav-link active" href="contact.html" style="color: var(--accent-blue) !important; text-shadow: 0 0 10px var(--glow-blue);">Contact</a>
        </div>
    </div>
</nav>

<div class="header-section text-center" id="header-trigger">
    <div class="container">
        <h1 class="display-3 fw-bold text-reveal" id="main-title">Contact Me</h1>
        <p class="lead text-reveal" style="letter-spacing: 3px;">"Be Prepared for our EXCITEMENT!!!"</p>
    </div>
</div>

<div class="container py-4" style="position: relative; z-index: 2;">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <a href="https://wa.me/6281320711880" target="_blank" class="contact-link text-reveal">
                <i class="fa-brands fa-whatsapp icon-wa"></i>
                <div class="text-start">
                    <h5 class="mb-0 fw-bold">WhatsApp</h5>
                    <span style="color: #ccc; font-size: 0.9rem;">081320711880</span>
                </div>
            </a>

            <a href="https://instagram.com/alexander_augustino" target="_blank" class="contact-link text-reveal">
                <i class="fa-brands fa-instagram icon-ig"></i>
                <div class="text-start">
                    <h5 class="mb-0 fw-bold">Instagram</h5>
                    <span style="color: #ccc; font-size: 0.9rem;">@alexander_augustino_</span>
                </div>
            </a>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('blackhole-canvas');
    const ctx = canvas.getContext('2d');
    const mainTitle = document.getElementById('main-title');
    let width, height, centerX, centerY;
    
    let backgroundParticles = [];
    let diskParticles = [];

    function updateCenters() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        
        const rect = mainTitle.getBoundingClientRect();
        centerX = rect.left + rect.width / 2;
        centerY = rect.top + rect.height / 2;
    }

    function initParticles() {
        backgroundParticles = [];
        diskParticles = [];
        for (let i = 0; i < 200; i++) backgroundParticles.push(new LinearParticle());
        for (let i = 0; i < 500; i++) diskParticles.push(new AccretionParticle());
    }

    class LinearParticle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 1.2;
            this.speed = Math.random() * 2 + 1;
            this.opacity = Math.random() * 0.5;
        }
        update() {
            let dx = centerX - this.x;
            let dy = centerY - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
            if (dist < 40) this.reset();
        }
        draw() {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class AccretionParticle {
        constructor() { this.reset(); }
        reset() {
            this.angle = Math.random() * Math.PI * 2;
            this.radius = 80 + Math.random() * 150; 
            this.angularSpeed = (0.015 + Math.random() * 0.025);
            this.history = [];
            this.historyLimit = 10 + Math.random() * 15;
            this.color = Math.random() > 0.5 ? '#00d2ff' : '#0072ff';
        }
        update() {
            this.angle += this.angularSpeed;
            this.radius -= 0.15;
            let x = centerX + Math.cos(this.angle) * this.radius;
            let y = centerY + Math.sin(this.angle) * this.radius;
            this.history.push({x, y});
            if (this.history.length > this.historyLimit) this.history.shift();
            if (this.radius < 40) this.reset();
        }
        draw() {
            if (this.history.length < 2) return;
            ctx.beginPath();
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.3;
            ctx.moveTo(this.history[0].x, this.history[0].y);
            for (let i = 1; i < this.history.length; i++) ctx.lineTo(this.history[i].x, this.history[i].y);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }
    }

    // FUNGSI BARU: Menggambar Singularity (Core & Glow) di Canvas
    function drawBlackholeCore() {
        ctx.save();
        
        // 1. Outer Glow (Large Deep Blue)
        let gradientOuter = ctx.createRadialGradient(centerX, centerY, 40, centerX, centerY, 120);
        gradientOuter.addColorStop(0, 'rgba(0, 114, 255, 0.4)');
        gradientOuter.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradientOuter;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 120, 0, Math.PI * 2);
        ctx.fill();

        // 2. Inner Glow (Bright Cyan)
        let gradientInner = ctx.createRadialGradient(centerX, centerY, 30, centerX, centerY, 70);
        gradientInner.addColorStop(0, 'rgba(0, 210, 255, 0.6)');
        gradientInner.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradientInner;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 70, 0, Math.PI * 2);
        ctx.fill();

        // 3. Singularity (The Black Hole)
        ctx.fillStyle = '#000';
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#000';
        ctx.beginPath();
        ctx.arc(centerX, centerY, 40, 0, Math.PI * 2); // Ukuran core pas di "Contact Me"
        ctx.fill();
        
        ctx.restore();
    }

    function animate() {
        // Track posisi judul setiap frame
        const rect = mainTitle.getBoundingClientRect();
        centerX = rect.left + rect.width / 2;
        centerY = rect.top + rect.height / 2;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, width, height);

        // Gambar core tepat di titik pusat gerakan
        drawBlackholeCore();

        ctx.globalCompositeOperation = 'lighter';
        backgroundParticles.forEach(p => { p.update(); p.draw(); });
        diskParticles.forEach(p => { p.update(); p.draw(); });
        ctx.globalCompositeOperation = 'source-over';

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        updateCenters();
        initParticles();
    });

    // Inisialisasi awal
    updateCenters();
    initParticles();
    animate();

    window.addEventListener('load', () => {
        const loader = document.getElementById('intro-loader');
        setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
                document.querySelectorAll('.text-reveal').forEach((el, i) => {
                    setTimeout(() => el.classList.add('active'), i * 200);
                });
            }, 800);
        }, 1500);
    });
</script>
</body>
</html>
