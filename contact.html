<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --navy: #1e3c72; 
            --navy-dark: #05080a; /* Lebih gelap untuk efek blackhole */
            --accent-blue: #00d2ff; 
            --white: #ffffff; 
            --event-horizon: rgba(0, 210, 255, 0.3);
        }

        body { 
            background-color: var(--navy-dark); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            color: white;
            perspective: 1000px; /* Memberikan efek 3D pada elemen yang tertarik */
        }
        
        /* Intro Loader - Tetap sesuai request */
        #intro-loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--navy-dark); z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 1s ease-out; 
        }
        .circuit-svg { 
            width: 280px; stroke: var(--accent-blue); stroke-width: 2; fill: none; 
            stroke-dasharray: 500; stroke-dashoffset: 500; 
            animation: flow 3s infinite alternate ease-in-out; 
        }
        @keyframes flow { to { stroke-dashoffset: 0; filter: drop-shadow(0 0 15px var(--accent-blue)); } }
        
        /* Blackhole & Warp Canvas */
        #blackhole-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            filter: blur(1px);
        }

        /* Nav */
        .navbar { 
            background: rgba(10, 14, 20, 0.8) !important; 
            backdrop-filter: blur(15px);
            padding: 15px 0; 
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
        }
        
        /* Header Section dengan Blackhole Visual */
        .header-section { 
            position: relative;
            padding: 150px 0 100px 0; 
            overflow: visible;
        }

        .singularity-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: black;
            border-radius: 50%;
            z-index: -1;
            box-shadow: 
                0 0 60px 20px #000,
                0 0 100px 30px var(--event-horizon),
                0 0 200px 60px rgba(0, 210, 255, 0.1);
            animation: pulse-gravity 4s infinite ease-in-out;
        }

        @keyframes pulse-gravity {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* GFX Manipulation: Elemen seakan tertarik */
        .attraction-zone {
            transform-style: preserve-3d;
        }
        
        /* Animasi Reveal */
        .text-reveal { 
            opacity: 0; 
            transform: translateY(40px) translateZ(0); 
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        .text-reveal.active { 
            opacity: 1; 
            transform: translateY(0) translateZ(50px); /* Teks sedikit "maju" keluar dari layar */
        }
        
        /* Kartu Kontak (Content & Effect Tetap) */
        .contact-link { 
            text-decoration: none; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            padding: 25px; 
            border-radius: 24px; 
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background: rgba(255, 255, 255, 0.05); 
            margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .contact-link:hover { 
            transform: scale(1.05) translateZ(30px); 
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.3); 
            border-color: var(--accent-blue);
        }

        .icon-wa { color: #25D366; font-size: 2.5rem; margin-right: 25px; filter: drop-shadow(0 0 10px rgba(37, 211, 102, 0.5)); }
        .icon-ig { color: #E4405F; font-size: 2.5rem; margin-right: 25px; filter: drop-shadow(0 0 10px rgba(228, 64, 95, 0.5)); }

        .vignette-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>

<script>
    // --- SINGULARITY ENGINE (Blackhole Effect) ---
    const canvas = document.getElementById('blackhole-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 150; i++) {
            particles.push(new Particle());
        }
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            // Spawn partikel di luar radius tertentu agar seolah tertarik dari luar
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.max(width, height) * (0.5 + Math.random() * 0.5);
            this.x = width / 2 + Math.cos(angle) * dist;
            this.y = height / 2 + Math.sin(angle) * dist;
            this.size = Math.random() * 2 + 0.5;
            this.speed = Math.random() * 2 + 1;
            this.brightness = Math.random() * 0.5 + 0.5;
        }

        update() {
            const dx = width / 2 - this.x;
            const dy = height / 2 - this.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 20) {
                this.reset();
            } else {
                // Tarikan gravitasi: Semakin dekat semakin cepat
                const force = Math.min(8, 500 / distance);
                this.x += (dx / distance) * force * this.speed;
                this.y += (dy / distance) * force * this.speed;
            }
        }

        draw() {
            ctx.fillStyle = `rgba(0, 210, 255, ${this.brightness})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function animate() {
        // Efek trail/motion blur
        ctx.fillStyle = 'rgba(5, 8, 10, 0.2)';
        ctx.fillRect(0, 0, width, height);

        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    animate();

    // --- LOADER & REVEAL LOGIC ---
    window.addEventListener('load', () => {
        const loader = document.getElementById('intro-loader');
        setTimeout(() => {
            if (loader) {
                loader.style.opacity = '0'; 
                loader.style.pointerEvents = 'none';
                
                document.querySelectorAll('.text-reveal').forEach((el, index) => {
                    setTimeout(() => el.classList.add('active'), 400 + (index * 200));
                });
                
                setTimeout(() => loader.style.display = 'none', 1000);
            }
        }, 1200);
    });
</script>
